    body::before {

      position: fixed;

    .app {

      z-index: 1;

    }

    .points-unit {

    .tap-section {

    .tap-ring {

        radial-gradient(

        );

        0 0 0 1px rgba(90,130,230,0.13),

    }

    .tap-btn {
      width: 194px;
      height: 194px;

      border-radius: 50%;

      border: 1px solid rgba(160,190,255,0.32);

      background:
        radial-gradient(
          circle at 34% 23%,
          #5879be 0%,
          #304e88 32%,
          #1a2d51 66%,
          #0b1529 100%
        );

      color: #ffffff;

      font-size: 31px;

      letter-spacing: 4px;

      cursor: pointer;
      user-select: none;

        0 18px 42px rgba(0,0,0,0.58),
        0 0 40px rgba(70,110,220,0.25),

        inset 0 -12px 20px rgba(0,0,0,0.32);

      transition:
        transform 0.055s ease,
        filter 0.08s ease;
    }

    .tap-btn:active {
      transform: scale(0.90);
      filter: brightness(1.18);
    }

    .tap-btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .tap-hint {
      margin-top: 14px;

    }

    /* =========================
       TAP QUEUE
    ========================= */

    .queue {
      min-height: 17px;

      margin-top: 7px;

      color: #7485a7;

      font-size: 10px;

      opacity: 0;

      transition: opacity 0.15s ease;
    }

    .queue.visible {
      opacity: 1;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      width: 100%;
    }

    .stat-card {
      padding: 17px 14px;

      border-radius: 20px;

      background:
        rgba(14,20,34,0.92);

      border: 1px solid rgba(110,135,190,0.13);

      box-shadow:
        0 10px 27px rgba(0,0,0,0.22);
    }

      color: #68758c;

      font-size: 10px;

      margin-bottom: 7px;
    }

    .stat-value {

    }

    .timer {
      direction: ltr;
      text-align: right;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      width: 100%;

      margin-top: 14px;

      padding: 12px;

      border-radius: 14px;

      background:
        rgba(90,25,35,0.45);

      border:
        1px solid rgba(220,75,95,0.25);

      color: #ff9eaa;

      font-size: 11px;

      text-align: center;

      display: none;

      word-break: break-word;
    }

    /* =========================
       +1
    ========================= */

    .tap-effect {
      position: fixed;

      pointer-events: none;

      z-index: 9999;

      color: #a9c5ff;

      font-size: 26px;

      font-weight: 900;

      animation:
        floatUp 0.55s ease-out forwards;
    }

    @keyframes floatUp {

      0% {
        opacity: 1;

        transform:
          translate(-50%, 0)

      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -75px)
          scale(1.35);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 360px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tap-ring {
        width: 220px;

      }

      }

        font-size: 42px;
      }
    }

  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="logo">
        NEXORA
      </div>

      <div class="subtitle">
        TAP • EARN • BUILD
      </div>

    </header>


    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-label">
        موجودی امتیاز
      </div>

      <div
        class="points"
        id="points"
      >
        0
      </div>

      <div class="points-unit">
        NEXORA POINTS
      </div>

    </section>


    <!-- TAP -->

    <section class="tap-section">

      <div class="tap-ring">

        <button
          id="tapBtn"
          class="tap-btn"
          type="button"
        >
          TAP
        </button>

      </div>

      <div class="tap-hint">
        برای دریافت امتیاز ضربه بزن
      </div>

      <div
        id="queue"
        class="queue"
      >
        در حال ارسال...
      </div>

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat-card">

        <div class="stat-title">
          درخواست باقی‌مانده
        </div>

        <div
          class="stat-value"
          id="remaining"
        >
          1000
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          زمان تا ریست
        </div>

        <div
          class="stat-value timer"
          id="timer"
        >
          08:00:00
        </div>

      </div>

    </section>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="error-box"
    ></div>

  </main>


  <script>

    // ==========================================
    // TELEGRAM
    // ==========================================

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    // ==========================================
    // SUPABASE API
    // ==========================================

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    // ==========================================
    // SETTINGS
    // ==========================================

    const MAX_REQUESTS = 1000;

    const EIGHT_HOURS =
      8 * 60 * 60 * 1000;


    // ==========================================
    // ELEMENTS
    // ==========================================

    const tapBtn =
      document.getElementById("tapBtn");

    const pointsEl =
      document.getElementById("points");

    const remainingEl =
      document.getElementById("remaining");

    const timerEl =
      document.getElementById("timer");

    const errorBox =
      document.getElementById("errorBox");

    const queueEl =
      document.getElementById("queue");


    // ==========================================
    // LOCAL DATA
    // ==========================================

    let points =
      Number(
        localStorage.getItem("nexo_points")
      ) || 0;


    let remaining =
      Number(
        localStorage.getItem("nexo_remaining")
      );


    if (!Number.isFinite(remaining)) {

      remaining =
        MAX_REQUESTS;

    }


    let resetAt =
      Number(
        localStorage.getItem("nexo_reset_at")
      ) || 0;


    // ==========================================
    // TELEGRAM USER
    // ==========================================

    let telegramUser = null;


    if (
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
    ) {

      telegramUser =
        tg.initDataUnsafe.user;

    } else {

      telegramUser = {
        id: "test_user"
      };

    }


    // ==========================================
    // TAP QUEUE
    // ==========================================

    let tapQueue = 0;

    let processing = false;


    // ==========================================
    // UI
    // ==========================================

    function updateUI() {

      pointsEl.textContent =
        points.toLocaleString("en-US");


      remainingEl.textContent =
        Math.max(
          0,
          remaining
        ).toLocaleString("en-US");


      updateQueueUI();

    }


    function updateQueueUI() {

      if (tapQueue > 0) {

        queueEl.textContent =
          "در صف: " +
          tapQueue.toLocaleString("en-US") +
          " TAP";


        queueEl.classList.add(
          "visible"
        );

      } else {

        queueEl.textContent =
          "";


        queueEl.classList.remove(
          "visible"
        );

      }

    }


    // ==========================================
    // TIMER
    // ==========================================

    function updateTimer() {

      if (!resetAt) {

        timerEl.textContent =
          "08:00:00";

        return;

      }


      const diff =
        resetAt - Date.now();


      if (diff <= 0) {

        remaining =
          MAX_REQUESTS;


        localStorage.setItem(
          "nexo_remaining",
          String(MAX_REQUESTS)
        );


        localStorage.removeItem(
          "nexo_reset_at"
        );


        resetAt = 0;


        tapBtn.classList.remove(
          "disabled"
        );


        updateUI();


        timerEl.textContent =
          "08:00:00";


        return;

      }


      const totalSeconds =
        Math.floor(
          diff / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      timerEl.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    }


    // ==========================================
    // ERROR
    // ==========================================

    function showError(message) {

      errorBox.style.display =
        "block";


      errorBox.textContent =
        message;

    }


    function clearError() {

      errorBox.style.display =
        "none";


      errorBox.textContent =
        "";

    }


    // ==========================================
    // +1 EFFECT
    // ==========================================

    function showTapEffect() {

      const effect =
        document.createElement("div");


      effect.className =
        "tap-effect";


      effect.textContent =
        "+1";


      const rect =
        tapBtn.getBoundingClientRect();


      effect.style.left =
        (
          rect.left +
          rect.width / 2
        ) + "px";


      effect.style.top =
        (
          rect.top + 15
        ) + "px";


      document.body.appendChild(
        effect
      );


      setTimeout(
        () => effect.remove(),
        600
      );

    }


    // ==========================================
    // SEND ONE TAP
    // ==========================================

    async function sendOneTap() {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action: "tap",

              telegram_user:
                telegramUser

            })

          }
        );


      const rawText =
        await response.text();


      console.log(
        "SERVER STATUS:",
        response.status
      );


      console.log(
        "SERVER RESPONSE:",
        rawText
      );


      let data;


      try {

        data =
          JSON.parse(
            rawText
          );

      } catch {

        throw new Error(
          "پاسخ نامعتبر از سرور: " +
          rawText
        );

      }


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(

          data.error ||

          data.message ||

          (
            "خطای سرور " +
            response.status
          )

        );

      }


      // ================================
      // UPDATE POINTS
      // ================================

      if (
        typeof data.points !==
        "undefined"
      ) {

        points =
          Number(
            data.points
          );

      } else {

        points =
          points + 1;

      }


      // ================================
      // UPDATE REMAINING
      // ================================

      if (
        typeof data.remaining !==
        "undefined"
      ) {

        remaining =
          Number(
            data.remaining
          );

      } else {

        remaining =
          Math.max(
            0,
            remaining - 1
          );

      }


      // ================================
      // RESET TIME
      // ================================

      if (data.resetAt) {

        resetAt =
          new Date(
            data.resetAt
          ).getTime();


        localStorage.setItem(
          "nexo_reset_at",
          String(resetAt)
        );

      }


      // ================================
      // SAVE
      // ================================

      localStorage.setItem(
        "nexo_points",
        String(points)
      );


      localStorage.setItem(
        "nexo_remaining",
        String(remaining)
      );


      updateUI();

      showTapEffect();

    }


    // ==========================================
    // PROCESS TAP QUEUE
    // ==========================================

    async function processTapQueue() {

      if (processing) {
        return;
      }


      if (tapQueue <= 0) {
        return;
      }


      if (remaining <= 0) {

        tapQueue = 0;

        updateQueueUI();

        tapBtn.classList.add(
          "disabled"
        );

        showError(
          "سقف ۱۰۰۰ درخواست شما تمام شده است."
        );

        return;

      }


      processing = true;


      while (
        tapQueue > 0 &&
        remaining > 0
      ) {

        tapQueue--;

        updateQueueUI();


        try {

          await sendOneTap();


        } catch (error) {

          console.error(
            "TAP ERROR:",
            error
          );


          const message =
            error &&
            error.message
              ? error.message
              : String(error);


          showError(
            "خطای سرور: " +
            message
          );


          /*
            TAPهایی که هنوز در صف هستند
            از بین نمی‌روند.
          */

          processing = false;

          updateQueueUI();

          return;

        }

      }


      processing = false;


      updateQueueUI();


      if (remaining <= 0) {

        tapBtn.classList.add(
          "disabled"
        );

      }

    }


    // ==========================================
    // TAP CLICK
    // ==========================================

    function tap() {

      if (remaining <= 0) {

        showError(
          "سقف ۱۰۰۰ درخواست شما تمام شده است."
        );

        return;

      }


      clearError();


      /*
        هر لمس یک TAP به صف اضافه می‌کند.
        بنابراین اگر خیلی سریع ۱۰ بار بزنی،
        هر ۱۰ تا ثبت می‌شوند.
      */

      tapQueue++;


      updateQueueUI();


      processTapQueue();

    }


    // ==========================================
    // BUTTON
    // ==========================================

    tapBtn.addEventListener(
      "click",
      tap
    );


    /*
      جلوگیری از رفتار اضافی لمس موبایل،
      بدون غیرفعال کردن TAP.
    */

    tapBtn.addEventListener(
      "touchstart",
      function(e) {

        e.preventDefault();

      },
      {
        passive: false
      }
    );


    // ==========================================
    // START
    // ==========================================

    updateUI();

    updateTimer();


    setInterval(
      updateTimer,
      1000
    );

  </script>

</body>
</html>
