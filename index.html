<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #080810;

    .app {
      width: 100%;

      min-height: 100vh;

    .header {

        0 0 25px rgba(116, 103, 255, 0.45),
        0 0 70px rgba(116, 103, 255, 0.15);

      display: flex;
      justify-content: center;

      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition: transform 0.08s;
    }

    .tap-circle:active {
      transform: scale(0.92);

    .tap-circle.disabled {
      opacity: 0.45;

<body>

  <div class="app">

    <div class="header">
      <div class="logo-title">NEXORA</div>

      <button class="profile" type="button">
        👤
      </button>
    </div>


    <div class="points-box">

      <div class="points" id="points">
        0
      </div>

      <div class="points-label">
        NEXO POINTS
      </div>

    </div>


    <div class="tap-container">

      <div
        class="tap-circle"
        id="tapButton"
        onclick="tapEarn()"
      >

        <div class="nexora-logo">
          NEXORA
        </div>

      </div>

    </div>


    <div class="tap-text" id="tapText">
      TAP TO EARN +1
    </div>


    <!-- =========================
         QUOTA
    ========================= -->

    <div class="quota-box">

      <div class="quota-title">
        TAP QUOTA
      </div>

      <div class="quota-count" id="quota">
        1000 / 1000
      </div>

      <div class="timer-label">
        RESET IN
      </div>

      <div class="timer" id="timer">
        08:00:00
      </div>

    </div>


    <div class="menu">

      <button
        type="button"
        onclick="showMessage('Tasks coming soon')"
      >
        📋 Tasks
      </button>

      <button
        type="button"
        onclick="showMessage('Referral coming soon')"
      >
        👥 Referral
      </button>

      <button
        type="button"
        onclick="showMessage('Ranking coming soon')"
      >
        🏆 Ranking
      </button>

    </div>

  </div>


  <div
    class="message"
    id="message"
  ></div>


  <script>

    // ==============================
    // SUPABASE EDGE FUNCTION
    // ==============================

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    // ==============================
    // TELEGRAM
    // ==============================

    let telegramUser = null;

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

      if (
        Telegram.WebApp.initDataUnsafe &&
        Telegram.WebApp.initDataUnsafe.user
      ) {

        telegramUser =
          Telegram.WebApp.initDataUnsafe.user;

      }

    }


    // ==============================
    // POINTS
    // ==============================

    let points = Number(
      localStorage.getItem(
        "nexora_points"
      ) || 0
    );

    updatePoints();


    // ==============================
    // QUOTA
    // ==============================

    const LIMIT = 1000;

    let used = 0;

    let resetAt = null;

    let tapping = false;

    let timerInterval = null;


    // ==============================
    // INITIAL LOAD
    // ==============================

    loadQuota();


    // ==============================
    // LOAD QUOTA FROM SERVER
    // ==============================

    async function loadQuota() {

      if (!telegramUser) {

        showMessage(
          "Open NEXORA inside Telegram."
        );

        return;
      }


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  action:
                    "status",

                  telegram_user:
                    telegramUser
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load quota"
          );

        }


        if (!data.success) {

          throw new Error(
            data.error ||
            "Unable to load quota"
          );

        }


        // ==========================
        // SERVER POINTS
        // ==========================

        if (
          typeof data.points ===
          "number"
        ) {

          points =
            data.points;

          localStorage.setItem(
            "nexora_points",
            String(points)
          );

          updatePoints();

        }


        // ==========================
        // SERVER QUOTA
        // ==========================

        used =
          Number(
            data.used || 0
          );

        resetAt =
          data.resetAt
            ? new Date(
                data.resetAt
              ).getTime()
            : null;


        updateQuota();

        startTimer();

      } catch (error) {

        console.error(
          "NEXORA STATUS ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Connection error"
        );

      }

    }


    // ==============================
    // TAP TO EARN
    // ==============================

    async function tapEarn() {

      if (tapping) {
        return;
      }


      if (!telegramUser) {

        showMessage(
          "Open NEXORA inside Telegram."
        );

        return;
      }


      // Local UI protection only.
      // Real limit is checked by server.

      if (
        used >= LIMIT
      ) {

        showMessage(
          "1000 taps reached. Wait for reset."
        );

        return;

      }


      tapping = true;


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  action:
                    "tap",

                  telegram_user:
                    telegramUser

                })
            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Invalid server response"
          );

        }


        // ==========================
        // LIMIT REACHED
        // ==========================

        if (
          response.status === 429 &&
          data.error ===
            "LIMIT_REACHED"
        ) {

          used =
            LIMIT;

          resetAt =
            data.resetAt
              ? new Date(
                  data.resetAt
                ).getTime()
              : null;

          updateQuota();

          startTimer();

          showMessage(
            "1000 taps reached. Reset in 8 hours."
          );

          return;
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error: " +
            response.status
          );

        }


        if (!data.success) {

          throw new Error(
            data.error ||
            "Tap failed"
          );

        }


        // ==========================
        // SERVER CONFIRMED POINTS
        // ==========================

        if (
          typeof data.points ===
          "number"
        ) {

          points =
            data.points;

          localStorage.setItem(
            "nexora_points",
            String(points)
          );

          updatePoints();

        }


        // ==========================
        // SERVER QUOTA
        // ==========================

        used =
          Number(
            data.used || 0
          );

        resetAt =
          data.resetAt
            ? new Date(
                data.resetAt
              ).getTime()
            : null;


        updateQuota();

        startTimer();

        showPlusOne();

      } catch (error) {

        console.error(
          "NEXORA TAP ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Connection error"
        );

      } finally {

        tapping = false;

      }

    }


    // ==============================
    // UPDATE POINTS
    // ==============================

    function updatePoints() {

      document.getElementById(
        "points"
      ).innerText =
        points.toLocaleString();

    }


    // ==============================
    // UPDATE QUOTA
    // ==============================

    function updateQuota() {

      const remaining =
        Math.max(
          0,
          LIMIT - used
        );


      document.getElementById(
        "quota"
      ).innerText =
        remaining +
        " / " +
        LIMIT;


      const tapButton =
        document.getElementById(
          "tapButton"
        );

      const tapText =
        document.getElementById(
          "tapText"
        );


      if (
        remaining <= 0
      ) {

        tapButton.classList.add(
          "disabled"
        );

        tapText.innerText =
          "QUOTA FULL";

      } else {

        tapButton.classList.remove(
          "disabled"
        );

        tapText.innerText =
          "TAP TO EARN +1";

      }

    }


    // ==============================
    // TIMER
    // ==============================

    function startTimer() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

      }


      updateTimer();


      timerInterval =
        setInterval(
          updateTimer,
          1000
        );

    }


    function updateTimer() {

      if (!resetAt) {

        document.getElementById(
          "timer"
        ).innerText =
          "08:00:00";

        return;

      }


      const remainingMs =
        Math.max(
          0,
          resetAt -
          Date.now()
        );


      const totalSeconds =
        Math.ceil(
          remainingMs / 1000
        );


      if (
        totalSeconds <= 0
      ) {

        used = 0;

        resetAt = null;

        updateQuota();

        document.getElementById(
          "timer"
        ).innerText =
          "08:00:00";


        // Ask server for the
        // authoritative new window.

        loadQuota();

        return;

      }


      const hours =
        Math.floor(
          totalSeconds / 3600
        );

      const minutes =
        Math.floor(
          (
            totalSeconds % 3600
          ) / 60
        );

      const seconds =
        totalSeconds % 60;


      document.getElementById(
        "timer"
      ).innerText =

        String(hours)
          .padStart(2, "0") +

        ":" +

        String(minutes)
          .padStart(2, "0") +

        ":" +

        String(seconds)
          .padStart(2, "0");

    }


    // ==============================
    // +1 ANIMATION
    // ==============================

    function showPlusOne() {

      const effect =
        document.createElement(
          "div"
        );


      effect.innerText =
        "+1";

      effect.style.position =
        "fixed";

      effect.style.left =
        "50%";

      effect.style.top =
        "45%";

      effect.style.transform =
        "translate(-50%, -50%)";

      effect.style.fontSize =
        "28px";

      effect.style.fontWeight =
        "900";

      effect.style.color =
        "#7467ff";

      effect.style.pointerEvents =
        "none";

      effect.style.zIndex =
        "9999";

      effect.style.transition =
        "all 0.6s ease";


      document.body.appendChild(
        effect
      );


      requestAnimationFrame(() => {

        effect.style.top =
          "35%";

        effect.style.opacity =
          "0";

      });


      setTimeout(() => {

        effect.remove();

      }, 650);

    }


    // ==============================
    // MESSAGE
    // ==============================

    function showMessage(
      text
    ) {

      const message =
        document.getElementById(
          "message"
        );


      message.innerText =
        text;


      message.style.display =
        "block";


      clearTimeout(
        window.nexoraMessageTimer
      );


      window.nexoraMessageTimer =
        setTimeout(() => {

          message.style.display =
            "none";

        }, 1800);

    }

  </script>

</body>
</html>
