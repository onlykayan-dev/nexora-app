<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #080810;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 25px 20px;
      text-align: center;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-title {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #44445c;
      background: #151522;
      color: white;
      font-size: 20px;
    }

    .points-box {
      margin-top: 45px;
    }

    .points {
      font-size: 42px;
      font-weight: 800;
    }

    .points-label {
      margin-top: 5px;
      color: #8b8b9d;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .tap-container {
      margin-top: 55px;
      display: flex;
      justify-content: center;
    }

    .tap-circle {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, #25234a, #11111d);
      border: 5px solid #7467ff;
      box-shadow:
        0 0 25px rgba(116, 103, 255, 0.45),
        0 0 70px rgba(116, 103, 255, 0.15);

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;
      user-select: none;

      transition: transform 0.08s;
    }

    .tap-circle:active {
      transform: scale(0.92);
    }

    .nexora-logo {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .tap-text {
      margin-top: 28px;
      color: #8b8b9d;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .menu {
      margin-top: 55px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .menu button {
      padding: 14px 5px;
      border: 1px solid #28283b;
      border-radius: 14px;
      background: #11111b;
      color: white;
      font-size: 12px;
    }

    .menu button:active {
      transform: scale(0.96);
    }

    .message {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      background: #20202d;
      border: 1px solid #38384d;
      padding: 10px 18px;
      border-radius: 12px;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo-title">NEXORA</div>

      <button class="profile">
        👤
      </button>
    </div>

    <div class="points-box">
      <div class="points" id="points">0</div>

      <div class="points-label">
        NEXO POINTS
      </div>
    </div>

    <div class="tap-container">

      <div class="tap-circle" onclick="tapEarn()">

        <div class="nexora-logo">
          NEXORA
        </div>

      </div>

    </div>

    <div class="tap-text">
      TAP TO EARN +1
    </div>

    <div class="menu">

      <button onclick="showMessage('Tasks coming soon')">
        📋 Tasks
      </button>

      <button onclick="showMessage('Referral coming soon')">
        👥 Referral
      </button>

      <button onclick="showMessage('Ranking coming soon')">
        🏆 Ranking
      </button>

    </div>

  </div>

  <div class="message" id="message"></div>

  <script>

    // Telegram Mini App
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    // Load saved points
    let points = Number(
      localStorage.getItem("nexora_points") || 0
    );

    updatePoints();


    // Tap to Earn
    function tapEarn() {

      points += 1;

      localStorage.setItem(
        "nexora_points",
        points
      );

      updatePoints();

    }


    // Update points on screen
    function updatePoints() {

      document.getElementById("points").innerText =
        points.toLocaleString();

    }


    // Message
    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.innerText = text;
      message.style.display = "block";

      setTimeout(() => {
        message.style.display = "none";
      }, 1800);

    }

  </script>

</body>
</html>
