  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;

<body>

  <div class="app">

    <div class="header">
      <div class="logo-title">NEXORA</div>

      <button class="profile" type="button">
        👤
      </button>
    </div>

    <div class="points-box">
      <div class="points" id="points">0</div>

      <div class="points-label">
        NEXO POINTS
      </div>
    </div>

    <div class="tap-container">

      <div
        class="tap-circle"
        id="tapButton"
        onclick="tapEarn()"
      >

        <div class="nexora-logo">
          NEXORA
        </div>

      </div>

    </div>

    <div class="tap-text">
      TAP TO EARN +1
    </div>

    <div class="menu">

      <button type="button" onclick="showMessage('Tasks coming soon')">
        📋 Tasks
      </button>

      <button type="button" onclick="showMessage('Referral coming soon')">
        👥 Referral
      </button>

      <button type="button" onclick="showMessage('Ranking coming soon')">
        🏆 Ranking
      </button>

    </div>

  </div>

  <div class="message" id="message"></div>

  <script>

    // ==============================
    // SUPABASE EDGE FUNCTION
    // ==============================

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    // ==============================
    // TELEGRAM
    // ==============================

    let telegramUser = null;

    if (window.Telegram && window.Telegram.WebApp) {

      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

      if (
        Telegram.WebApp.initDataUnsafe &&
        Telegram.WebApp.initDataUnsafe.user
      ) {
        telegramUser =
          Telegram.WebApp.initDataUnsafe.user;
      }
    }


    // ==============================
    // LOCAL POINTS
    // ==============================

    let points = Number(
      localStorage.getItem("nexora_points") || 0
    );

    updatePoints();


    // ==============================
    // TAP LOCK
    // ==============================

    let tapping = false;


    // ==============================
    // TAP TO EARN
    // ==============================

    async function tapEarn() {

      // Prevent accidental double request
      if (tapping) {
        return;
      }

      if (!telegramUser) {

        showMessage(
          "Open NEXORA inside Telegram."
        );

        return;
      }

      tapping = true;

      try {

        const response = await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              action: "tap",

              telegram_user: telegramUser

            })
          }
        );


        let data;

        try {

          data = await response.json();

        } catch (error) {

          throw new Error(
            "Invalid server response"
          );
        }


        // Server error
        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error: " + response.status
          );
        }


        // Application error
        if (!data.success) {

          throw new Error(
            data.error ||
            "Tap failed"
          );
        }


        // ==========================
        // ADD SERVER CONFIRMED POINT
        // ==========================

        const added =
          Number(data.added || 0);

        if (added > 0) {

          points += added;

          localStorage.setItem(
            "nexora_points",
            String(points)
          );

          updatePoints();

          showPlusOne();

        }


        // ==========================
        // LIMIT MESSAGE
        // ==========================

        if (
          typeof data.remaining === "number" &&
          data.remaining <= 0
        ) {

          showMessage(
            "1000 taps reached. Reset in 8 hours."
          );

        }

      } catch (error) {

        console.error(
          "NEXORA TAP ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Connection error"
        );

      } finally {

        tapping = false;

      }
    }


    // ==============================
    // UPDATE POINTS
    // ==============================

    function updatePoints() {

      document.getElementById(
        "points"
      ).innerText =
        points.toLocaleString();

    }


    // ==============================
    // +1 ANIMATION
    // ==============================

    function showPlusOne() {

      const effect =
        document.createElement("div");

      effect.innerText = "+1";

      effect.style.position = "fixed";
      effect.style.left = "50%";
      effect.style.top = "45%";
      effect.style.transform =
        "translate(-50%, -50%)";
      effect.style.fontSize = "28px";
      effect.style.fontWeight = "900";
      effect.style.color = "#7467ff";
      effect.style.pointerEvents = "none";
      effect.style.zIndex = "9999";
      effect.style.transition =
        "all 0.6s ease";

      document.body.appendChild(effect);

      requestAnimationFrame(() => {

        effect.style.top = "35%";
        effect.style.opacity = "0";

      });

      setTimeout(() => {

        effect.remove();

      }, 650);
    }


    // ==============================
    // MESSAGE
    // ==============================

    function showMessage(text) {

      const message =
        document.getElementById(
          "message"
        );

      message.innerText = text;

      message.style.display =
        "block";

      clearTimeout(
        window.nexoraMessageTimer
      );

      window.nexoraMessageTimer =
        setTimeout(() => {

          message.style.display =
            "none";

        }, 1800);
    }

  </script>

</body>
</html>
