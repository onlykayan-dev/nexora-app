<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #172b65 0%,
          #080b18 45%,
          #05060d 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #00d9ff,
          #735cff,
          #d946ef
        );

      box-shadow:
        0 0 35px
        rgba(0, 210, 255, 0.35);

      font-size: 48px;
      font-weight: 900;
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #9da7c7;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .points-box {
      margin-bottom: 20px;
    }

    .points-label {
      color: #9da7c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    #points {
      font-size: 38px;
      font-weight: 900;

      background:
        linear-gradient(
          90deg,
          #00e5ff,
          #a855f7
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* LIMIT */

    .limit-info {
      margin-bottom: 18px;
    }

    .limit-count {
      font-size: 16px;
      font-weight: bold;
    }

    .limit-count span {
      color: #00d9ff;
    }

    .timer {
      margin-top: 5px;
      color: #7f89a8;
      font-size: 13px;
    }

    /* TAP CIRCLE */

    .tap-circle {
      width: 220px;
      height: 220px;

      margin: 0 auto;

      border-radius: 50%;

      background:
        conic-gradient(
          #00d9ff,
          #735cff,
          #d946ef,
          #00d9ff
        );

      padding: 7px;

      cursor: pointer;

      box-shadow:
        0 0 30px
        rgba(0, 217, 255, 0.30),

        0 0 70px
        rgba(115, 92, 255, 0.18);

      transition:
        transform 0.08s ease;
    }

    .tap-circle:active {
      transform: scale(0.94);
    }

    .tap-circle.disabled {
      filter: grayscale(0.8);
      opacity: 0.55;
      cursor: not-allowed;
    }

    .tap-inner {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #151d3b,
          #080b18
        );

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      user-select: none;
    }

    .tap-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .tap-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .tap-hint {
      margin-top: 7px;
      color: #7f89a8;
      font-size: 11px;
    }

    /* +1 */

    .plus-one {
      position: fixed;
      pointer-events: none;

      font-size: 28px;
      font-weight: 900;
      color: #00e5ff;

      animation:
        plusOne 0.8s ease-out
        forwards;

      z-index: 999;
    }

    @keyframes plusOne {

      0% {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-100px)
          scale(1.4);
      }

    }

    .footer {
      margin-top: 30px;
      color: #626b88;
      font-size: 10px;
    }

  </style>
</head>

<body>

  <div class="app">

    <div class="logo">
      N
    </div>

    <div class="title">
      NEXORA
    </div>

    <div class="subtitle">
      EARN • TAP • RISE
    </div>


    <!-- POINTS -->

    <div class="points-box">

      <div class="points-label">
        YOUR NEXO POINTS
      </div>

      <div id="points">
        0
      </div>

    </div>


    <!-- LIMIT -->

    <div class="limit-info">

      <div class="limit-count">
        <span id="remaining">
          1000
        </span>
        / 1000 REQUESTS
      </div>

      <div class="timer">
        ⏳ Reset in
        <span id="timer">
          08:00:00
        </span>
      </div>

    </div>


    <!-- TAP -->

    <div
      id="tapCircle"
      class="tap-circle"
      onclick="tapForPoint(event)"
    >

      <div class="tap-inner">

        <div class="tap-icon">
          ⚡
        </div>

        <div class="tap-text">
          TAP
        </div>

        <div class="tap-hint">
          +1 POINT
        </div>

      </div>

    </div>


    <div class="footer">
      NEXORA © 2026
    </div>

  </div>


  <script>

    /* TELEGRAM */

    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      window.Telegram.WebApp.ready();

      window.Telegram.WebApp.expand();

    }


    /* POINTS */

    let points =
      Number(
        localStorage.getItem(
          "nexo_points"
        )
      ) || 0;


    document.getElementById(
      "points"
    ).innerText =
      points.toLocaleString();


    /* =========================
       8 HOUR LIMIT
    ========================= */

    const MAX_REQUESTS = 1000;

    const EIGHT_HOURS =
      8 * 60 * 60 * 1000;


    let remaining =
      Number(
        localStorage.getItem(
          "nexo_remaining"
        )
      );


    let resetAt =
      Number(
        localStorage.getItem(
          "nexo_reset_at"
        )
      );


    /* FIRST START */

    if (
      !remaining ||
      remaining < 0 ||
      remaining > MAX_REQUESTS
    ) {

      remaining =
        MAX_REQUESTS;

    }


    if (
      !resetAt ||
      Date.now() >= resetAt
    ) {

      resetAt =
        Date.now() +
        EIGHT_HOURS;

      remaining =
        MAX_REQUESTS;

    }


    function saveLimit() {

      localStorage.setItem(
        "nexo_remaining",
        remaining
      );

      localStorage.setItem(
        "nexo_reset_at",
        resetAt
      );

    }


    function updateLimit() {

      document.getElementById(
        "remaining"
      ).innerText =
        remaining.toLocaleString();


      let timeLeft =
        Math.max(
          0,
          resetAt - Date.now()
        );


      let totalSeconds =
        Math.ceil(
          timeLeft / 1000
        );


      let hours =
        Math.floor(
          totalSeconds / 3600
        );


      let minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      let seconds =
        totalSeconds % 60;


      document.getElementById(
        "timer"
      ).innerText =
        String(hours).padStart(2, "0")
        + ":" +
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");


      const circle =
        document.getElementById(
          "tapCircle"
        );


      if (remaining <= 0) {

        circle.classList.add(
          "disabled"
        );

      } else {

        circle.classList.remove(
          "disabled"
        );

      }


      /* RESET AFTER 8 HOURS */

      if (
        timeLeft <= 0
      ) {

        remaining =
          MAX_REQUESTS;

        resetAt =
          Date.now() +
          EIGHT_HOURS;

        saveLimit();

      }

    }


    /* UPDATE EVERY SECOND */

    setInterval(
      function() {

        updateLimit();

      },
      1000
    );


    updateLimit();

    saveLimit();


    /* =========================
       TAP
    ========================= */

    function tapForPoint(event) {

      /* LIMIT */

      if (
        remaining <= 0
      ) {

        return;

      }


      /* ONE REQUEST */

      remaining--;


      /* ONE POINT */

      points++;


      /* SAVE */

      localStorage.setItem(
        "nexo_points",
        points
      );


      saveLimit();


      /* UPDATE */

      document.getElementById(
        "points"
      ).innerText =
        points.toLocaleString();


      updateLimit();


      /* +1 ANIMATION */

      const plus =
        document.createElement(
          "div"
        );


      plus.className =
        "plus-one";


      plus.innerText =
        "+1";


      plus.style.left =
        event.clientX + "px";


      plus.style.top =
        event.clientY + "px";


      document.body.appendChild(
        plus
      );


      setTimeout(
        function() {

          plus.remove();

        },
        800
      );

    }

  </script>

</body>
</html>
