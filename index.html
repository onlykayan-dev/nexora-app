<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #172b65 0%,
        #080b18 45%,
        #05060d 100%
      );
      color: white;
      padding: 20px 16px 40px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 85px;
      height: 85px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00d9ff, #735cff, #d946ef);
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.35);
      font-size: 48px;
      font-weight: 900;
    }

    .title {
      margin-top: 12px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .subtitle {
      margin-top: 6px;
      color: #9da7c7;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .card {
      background: rgba(18, 23, 45, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .points-label {
      color: #9da7c7;
      font-size: 13px;
    }

    .points {
      margin: 8px 0;
      font-size: 40px;
      font-weight: 900;
      background: linear-gradient(90deg, #00e5ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .streak {
      color: #ffb84d;
      font-size: 14px;
    }

    .claim {
      width: 100%;
      margin-top: 17px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #087fff, #8b5cf6);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .claim:active {
      transform: scale(0.98);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu {
      padding: 19px 10px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: #11162b;
      color: white;
      text-align: center;
      cursor: pointer;
    }

    .menu:active {
      transform: scale(0.98);
    }

    .menu-icon {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .menu-title {
      font-size: 14px;
      font-weight: bold;
    }

    .menu-desc {
      margin-top: 4px;
      color: #7f89a8;
      font-size: 11px;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #626b88;
      font-size: 11px;
    }

    #message {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: none;
      padding: 14px;
      border-radius: 14px;
      background: #151b32;
      border: 1px solid #303858;
      text-align: center;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">N</div>

      <div class="title">
        NEXORA
      </div>

      <div class="subtitle">
        EARN • COMPLETE • INVITE • RISE
      </div>
    </div>


    <div class="card">

      <div class="points-label">
        YOUR NEXO POINTS
      </div>

      <div class="points" id="points">
        0
      </div>

      <div class="streak">
        🔥 Daily Streak:
        <span id="streak">1</span>
        day
      </div>

      <button class="claim" onclick="claimDaily()">
        🎁 CLAIM DAILY REWARD
      </button>

    </div>


    <div class="grid">

      <div class="menu" onclick="showMessage('🎯 Tasks will be available soon!')">
        <div class="menu-icon">🎯</div>
        <div class="menu-title">Tasks</div>
        <div class="menu-desc">Earn points</div>
      </div>


      <div class="menu" onclick="inviteFriend()">
        <div class="menu-icon">👥</div>
        <div class="menu-title">Invite</div>
        <div class="menu-desc">Invite friends</div>
      </div>


      <div class="menu" onclick="showMessage('🏆 Leaderboard is coming soon!')">
        <div class="menu-icon">🏆</div>
        <div class="menu-title">Ranking</div>
        <div class="menu-desc">Top players</div>
      </div>


      <div class="menu" onclick="showMessage('👛 Wallet will be available later.')">
        <div class="menu-icon">👛</div>
        <div class="menu-title">Wallet</div>
        <div class="menu-desc">Connect wallet</div>
      </div>

    </div>


    <div class="footer">
      NEXORA © 2026
    </div>

  </div>


  <div id="message"></div>


  <script>

    let points =
      Number(localStorage.getItem("nexo_points")) || 0;

    let streak =
      Number(localStorage.getItem("nexo_streak")) || 1;

    let lastClaim =
      localStorage.getItem("nexo_last_claim");


    document.getElementById("points").innerText =
      points.toLocaleString();

    document.getElementById("streak").innerText =
      streak;


    function claimDaily() {

      const today =
        new Date().toDateString();

      if (lastClaim === today) {

        showMessage(
          "⏳ You already claimed today's reward!"
        );

        return;
      }


      points += 100;


      localStorage.setItem(
        "nexo_points",
        points
      );

      localStorage.setItem(
        "nexo_last_claim",
        today
      );


      document.getElementById("points").innerText =
        points.toLocaleString();


      showMessage(
        "🎉 +100 NEXO Points!"
      );
    }


    function inviteFriend() {

      let userId = "user";


      if (
        window.Telegram &&
        window.Telegram.WebApp &&
        window.Telegram.WebApp.initDataUnsafe &&
        window.Telegram.WebApp.initDataUnsafe.user
      ) {

        userId =
          window.Telegram.WebApp.initDataUnsafe.user.id;
      }


      const referralLink =
        "https://t.me/Nexora_NexoBot?start=ref_" +
        userId;


      if (
        window.Telegram &&
        window.Telegram.WebApp
      ) {

        window.Telegram.WebApp.openTelegramLink(
          "https://t.me/share/url?url=" +
          encodeURIComponent(referralLink) +
          "&text=" +
          encodeURIComponent(
            "🚀 Join me on NEXORA and earn points!"
          )
        );

      } else {

        navigator.clipboard.writeText(
          referralLink
        );

        showMessage(
          "🔗 Referral link copied!"
        );
      }
    }


    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.innerText = text;

      message.style.display =
        "block";


      setTimeout(function() {

        message.style.display =
          "none";

      }, 2500);
    }


    if (
      window.Telegram &&
      window.Telegram.WebApp
    ) {

      window.Telegram.WebApp.ready();

      window.Telegram.WebApp.expand();
    }
async function claimDaily() {
  try {
    const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;

    if (!tgUser?.id) {
      showMessage("لطفاً از داخل تلگرام وارد شوید");
      return;
    }
console.log("CLAIM DAILY START");
    const response = await fetch(
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          telegram_user: tgUser
        })
      }
    );

    const data = await response.json();

    if (!data.success) {
      showMessage("خطا در دریافت پاداش");
      return;
    }

    if (data.already_claimed) {
      showMessage("🎁 پاداش امروز را قبلاً گرفتی");
      return;
    }

    if (data.weekly_complete) {
      showMessage("🎉 پاداش هفتگی تمام شده است");
      return;
    }

    showMessage(
      `🎉 روز ${data.day}: +${data.reward} امتیاز`
    );

  } catch (error) {
    console.error(error);
    showMessage("خطا در اتصال به سرور");
  }
}
  </script>

</body>
</html>
