  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;

<body>

  <div class="app">

    <div class="logo">
      NEXORA
    </div>

    <div class="points-box">
      <div class="points-label">
        امتیاز شما
      </div>

      <div class="points" id="points">
        0
      </div>
    </div>

    <button class="tap-btn" id="tapBtn">
      TAP
    </button>

    <div class="status">

      <div class="status-title">
        درخواست باقی‌مانده
      </div>

      <div class="remaining" id="remaining">
        1000
      </div>

      <div class="timer" id="timer">
        08:00:00
      </div>

    </div>

    <div class="error-box" id="errorBox"></div>

  </div>

  <script>

    // ==============================
    // TELEGRAM
    // ==============================

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    // ==============================
    // SUPABASE EDGE FUNCTION
    // ==============================

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    // ==============================
    // SETTINGS
    // ==============================

    const MAX_REQUESTS = 1000;

    const EIGHT_HOURS =
      8 * 60 * 60 * 1000;


    // ==============================
    // ELEMENTS
    // ==============================

    const tapBtn =
      document.getElementById("tapBtn");

    const pointsEl =
      document.getElementById("points");

    const remainingEl =
      document.getElementById("remaining");

    const timerEl =
      document.getElementById("timer");

    const errorBox =
      document.getElementById("errorBox");


    // ==============================
    // LOCAL DATA
    // ==============================

    let points =
      Number(localStorage.getItem("nexo_points")) || 0;

    let remaining =
      Number(localStorage.getItem("nexo_remaining"));

    if (!Number.isFinite(remaining)) {
      remaining = MAX_REQUESTS;
    }

    let resetAt =
      Number(localStorage.getItem("nexo_reset_at")) || 0;


    // ==============================
    // TELEGRAM USER
    // ==============================

    let telegramUser = null;

    if (
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
    ) {

      telegramUser = tg.initDataUnsafe.user;

    } else {

      // فقط برای تست خارج از تلگرام
      telegramUser = {
        id: "test_user"
      };

    }


    // ==============================
    // UI
    // ==============================

    function updateUI() {

      pointsEl.textContent =
        points.toLocaleString("en-US");

      remainingEl.textContent =
        Math.max(0, remaining).toLocaleString("en-US");

    }


    // ==============================
    // TIMER
    // ==============================

    function updateTimer() {

      if (!resetAt) {

        timerEl.textContent = "08:00:00";

        return;
      }

      const diff =
        resetAt - Date.now();

      if (diff <= 0) {

        remaining = MAX_REQUESTS;

        localStorage.setItem(
          "nexo_remaining",
          String(MAX_REQUESTS)
        );

        localStorage.removeItem(
          "nexo_reset_at"
        );

        resetAt = 0;

        tapBtn.disabled = false;

        timerEl.textContent = "08:00:00";

        updateUI();

        return;
      }


      const totalSeconds =
        Math.floor(diff / 1000);

      const hours =
        Math.floor(totalSeconds / 3600);

      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );

      const seconds =
        totalSeconds % 60;


      timerEl.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    }


    // ==============================
    // ERROR
    // ==============================

    function showError(message) {

      errorBox.style.display = "block";

      errorBox.textContent =
        message;

    }


    function clearError() {

      errorBox.style.display = "none";

      errorBox.textContent = "";

    }


    // ==============================
    // TAP EFFECT
    // ==============================

    function showTapEffect() {

      const effect =
        document.createElement("div");

      effect.className =
        "tap-effect";

      effect.textContent =
        "+1";

      const rect =
        tapBtn.getBoundingClientRect();

      effect.style.left =
        (rect.left + rect.width / 2) + "px";

      effect.style.top =
        (rect.top + 20) + "px";

      document.body.appendChild(effect);

      setTimeout(() => {
        effect.remove();
      }, 800);

    }


    // ==============================
    // TAP
    // ==============================

    async function tap() {

      if (remaining <= 0) {

        showError(
          "سقف ۱۰۰۰ درخواست شما تمام شده است."
        );

        return;
      }


      clearError();

      tapBtn.disabled = true;


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                action: "tap",

                telegram_user:
                  telegramUser

              })

            }
          );


        const rawText =
          await response.text();


        console.log(
          "SERVER STATUS:",
          response.status
        );

        console.log(
          "SERVER RESPONSE:",
          rawText
        );


        let data;


        try {

          data =
            JSON.parse(rawText);

        } catch {

          throw new Error(
            "پاسخ نامعتبر از سرور (" +
            response.status +
            "): " +
            rawText
          );

        }


        // ==========================
        // SERVER ERROR
        // ==========================

        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(

            data.error ||

            data.message ||

            (
              "خطای سرور " +
              response.status
            )

          );

        }


        // ==========================
        // SUCCESS
        // ==========================

        if (
          typeof data.points !==
          "undefined"
        ) {

          points =
            Number(data.points);

        } else {

          points =
            points + 1;

        }


        localStorage.setItem(
          "nexo_points",
          String(points)
        );


        if (
          typeof data.remaining !==
          "undefined"
        ) {

          remaining =
            Number(data.remaining);

        } else {

          remaining =
            Math.max(
              0,
              remaining - 1
            );

        }


        localStorage.setItem(
          "nexo_remaining",
          String(remaining)
        );


        if (data.resetAt) {

          resetAt =
            new Date(
              data.resetAt
            ).getTime();


          localStorage.setItem(
            "nexo_reset_at",
            String(resetAt)
          );

        }


        updateUI();

        showTapEffect();


        if (remaining <= 0) {

          tapBtn.disabled = true;

        } else {

          tapBtn.disabled = false;

        }


      } catch (error) {

        console.error(
          "TAP ERROR:",
          error
        );


        const message =
          error &&
          error.message
            ? error.message
            : String(error);


        showError(
          "خطای واقعی:\n" +
          message
        );


        alert(
          "خطای واقعی:\n\n" +
          message
        );


        tapBtn.disabled =
          false;

      }

    }


    // ==============================
    // BUTTON
    // ==============================

    tapBtn.addEventListener(
      "click",
      tap
    );


    // ==============================
    // START
    // ==============================

    updateUI();

    updateTimer();


    setInterval(
      updateTimer,
      1000
    );

  </script>

</body>
</html>
