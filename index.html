<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #172b65 0%,
          #080b18 45%,
          #05060d 100%
        );
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #00d9ff,
          #735cff,
          #d946ef
        );
      box-shadow:
        0 0 35px rgba(0, 210, 255, .35);
      font-size: 48px;
      font-weight: 900;
      user-select: none;
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #9da7c7;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .points-box {
      margin-bottom: 20px;
    }

    .points-label {
      color: #9da7c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    #points {
      font-size: 38px;
      font-weight: 900;
      background:
        linear-gradient(
          90deg,
          #00e5ff,
          #a855f7
        );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .limit-info {
      margin-bottom: 18px;
    }

    .limit-count {
      font-size: 16px;
      font-weight: bold;
    }

    .limit-count span {
      color: #00d9ff;
    }

    .timer {
      margin-top: 5px;
      color: #7f89a8;
      font-size: 13px;
    }

    .tap-circle {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;

      background:
        conic-gradient(
          #00d9ff,
          #735cff,
          #d946ef,
          #00d9ff
        );

      padding: 7px;
      cursor: pointer;

      box-shadow:
        0 0 30px rgba(0, 217, 255, .30),
        0 0 70px rgba(115, 92, 255, .18);

      transition: transform .08s ease;

      -webkit-tap-highlight-color: transparent;
      outline: none;
      border: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .tap-circle:active {
      transform: scale(.94);
    }

    .tap-circle.disabled {
      filter: grayscale(.8);
      opacity: .55;
      cursor: not-allowed;
    }

    .tap-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #151d3b,
          #080b18
        );

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tap-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .tap-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .tap-hint {
      margin-top: 7px;
      color: #7f89a8;
      font-size: 11px;
    }

    .plus-one {
      position: fixed;
      pointer-events: none;
      font-size: 28px;
      font-weight: 900;
      color: #00e5ff;
      animation: plusOne .8s ease-out forwards;
      z-index: 999;
    }

    @keyframes plusOne {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.4);
      }
    }

    .footer {
      margin-top: 30px;
      color: #626b88;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">N</div>

    <div class="title">NEXORA</div>

    <div class="subtitle">
      EARN • TAP • RISE
    </div>

    <div class="points-box">

      <div class="points-label">
        YOUR NEXO POINTS
      </div>

      <div id="points">
        0
      </div>

    </div>

    <div class="limit-info">

      <div class="limit-count">
        <span id="remaining">1000</span>
        / 1000 REQUESTS
      </div>

      <div class="timer">
        ⏳ Reset in
        <span id="timer">08:00:00</span>
      </div>

    </div>

    <div
      id="tapCircle"
      class="tap-circle"
      onclick="tapForPoint(event)"
    >

      <div class="tap-inner">

        <div class="tap-icon">
          ⚡
        </div>

        <div class="tap-text">
          TAP
        </div>

        <div class="tap-hint">
          +1 POINT
        </div>

      </div>

    </div>

    <div class="footer">
      NEXORA © 2026
    </div>

  </div>

  <script>

    /* =========================
       TELEGRAM
    ========================= */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    /* =========================
       API
    ========================= */

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    /* =========================
       POINTS
    ========================= */

    let points =
      Number(
        localStorage.getItem("nexo_points")
      ) || 0;

    document.getElementById("points").innerText =
      points.toLocaleString();


    /* =========================
       LIMIT
    ========================= */

    const MAX_REQUESTS = 1000;

    const EIGHT_HOURS =
      8 * 60 * 60 * 1000;

    let remaining =
      Number(
        localStorage.getItem(
          "nexo_remaining"
        )
      );

    let resetAt =
      Number(
        localStorage.getItem(
          "nexo_reset_at"
        )
      );


    if (
      !Number.isFinite(remaining) ||
      remaining < 0 ||
      remaining > MAX_REQUESTS
    ) {
      remaining = MAX_REQUESTS;
    }


    if (
      !Number.isFinite(resetAt) ||
      Date.now() >= resetAt
    ) {
      resetAt =
        Date.now() + EIGHT_HOURS;

      remaining =
        MAX_REQUESTS;
    }


    function saveLimit() {

      localStorage.setItem(
        "nexo_remaining",
        String(remaining)
      );

      localStorage.setItem(
        "nexo_reset_at",
        String(resetAt)
      );
    }


    function updateLimit() {

      const remainingElement =
        document.getElementById(
          "remaining"
        );

      const timerElement =
        document.getElementById(
          "timer"
        );

      remainingElement.innerText =
        remaining.toLocaleString();


      let timeLeft =
        Math.max(
          0,
          resetAt - Date.now()
        );


      const totalSeconds =
        Math.ceil(
          timeLeft / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      timerElement.innerText =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


      const circle =
        document.getElementById(
          "tapCircle"
        );


      if (remaining <= 0) {
        circle.classList.add("disabled");
      } else {
        circle.classList.remove("disabled");
      }


      if (timeLeft <= 0) {

        remaining =
          MAX_REQUESTS;

        resetAt =
          Date.now() +
          EIGHT_HOURS;

        saveLimit();
      }
    }


    setInterval(
      updateLimit,
      1000
    );

    updateLimit();

    saveLimit();


    /* =========================
       TAP
    ========================= */

    async function tapForPoint(event) {

      const circle =
        document.getElementById(
          "tapCircle"
        );


      if (
        circle.dataset.loading ===
        "true"
      ) {
        return;
      }


      if (remaining <= 0) {

        alert(
          "سهمیه ۱۰۰۰ درخواست شما تمام شده است."
        );

        return;
      }


      circle.dataset.loading =
        "true";


      try {

        /* =====================
           TELEGRAM USER
        ===================== */

        const telegramUser =
          tg &&
          tg.initDataUnsafe &&
          tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user
            : null;


        if (!telegramUser) {

          alert(
            "Telegram user پیدا نشد.\n\n" +
            "Mini App باید از داخل Telegram باز شود."
          );

          return;
        }


        if (!telegramUser.id) {

          alert(
            "Telegram User ID پیدا نشد."
          );

          return;
        }


        console.log(
          "TELEGRAM USER:",
          telegramUser
        );


        /* =====================
           SEND TO SUPABASE
        ===================== */

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  action: "tap",

                  telegram_user:
                    telegramUser

                })
            }
          );


        /* =====================
           RESPONSE
        ===================== */

        const rawText =
          await response.text();


        console.log(
          "HTTP STATUS:",
          response.status
        );

        console.log(
          "RAW RESPONSE:",
          rawText
        );


        let data = {};

        try {

          data =
            JSON.parse(
              rawText
            );

        } catch {

          data = {
            success: false,
            error: "INVALID_JSON",
            message: rawText
          };

        }


        console.log(
          "NEXORA RESPONSE:",
          data
        );


        /* =====================
           LIMIT
        ===================== */

        if (
          response.status === 429 ||
          data.error ===
            "LIMIT_REACHED"
        ) {

          remaining = 0;


          if (data.resetAt) {

            resetAt =
              new Date(
                data.resetAt
              ).getTime();

          }


          saveLimit();

          updateLimit();


          alert(
            "سهمیه ۱۰۰۰ درخواست شما تمام شده است."
          );

          return;
        }


        /* =====================
           SERVER ERROR
        ===================== */

        if (
          !response.ok ||
          !data.success
        ) {

          alert(
            "خطای سرور\n\n" +

            "HTTP: " +
            response.status +

            "\n\nError: " +
            (
              data.error ||
              "UNKNOWN_ERROR"
            ) +

            "\n\nMessage: " +
            (
              data.message ||
              rawText ||
              "No response"
            )
          );

          return;
        }


        /* =====================
           POINTS
        ===================== */

        if (
          typeof data.points ===
          "number"
        ) {

          points =
            data.points;
        }


        /* =====================
           REMAINING
        ===================== */

        if (
          typeof data.remaining ===
          "number"
        ) {

          remaining =
            data.remaining;

        } else {

          remaining--;
        }


        /* =====================
           RESET TIME
        ===================== */

        if (data.resetAt) {

          resetAt =
            new Date(
              data.resetAt
            ).getTime();
        }


        /* =====================
           SAVE
        ===================== */

        localStorage.setItem(
          "nexo_points",
          String(points)
        );

        saveLimit();


        /* =====================
           SCREEN
        ===================== */

        document.getElementById(
          "points"
        ).innerText =
          points.toLocaleString();


        updateLimit();


        /* =====================
           +1
        ===================== */

        const plus =
          document.createElement(
            "div"
          );


        plus.className =
          "plus-one";


        plus.innerText =
          "+1";


        plus.style.left =
          event.clientX + "px";


        plus.style.top =
          event.clientY + "px";


        document.body.appendChild(
          plus
        );


        setTimeout(
          function () {
            plus.remove();
          },
          800
        );


      } catch (error) {

        console.error(
          "NEXORA ERROR:",
          error
        );


        alert(
          "خطا در اتصال\n\n" +
          (
            error?.message ||
            String(error)
          )
        );


      } finally {

        circle.dataset.loading =
          "false";
      }
    }

  </script>

</body>
</html>
