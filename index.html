  <style>
    * {

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;

    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;

    }

    /* HEADER */

    .header {
      text-align: center;
      padding-top: 10px;

    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;

    }

    .subtitle {
      margin-top: 7px;
      color: #7d8ba5;

      letter-spacing: 1px;
    }

    /* POINTS CARD */

    .points-box {
      width: 100%;
      padding: 22px;
      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(28, 38, 62, 0.95),
          rgba(12, 17, 29, 0.95)
        );

      border: 1px solid rgba(105, 132, 180, 0.18);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.35),

    .points-label {
      color: #8795ad;

      background: linear-gradient(

      -webkit-background-clip: text;

    }

    .points-unit {
      margin-top: 8px;

    /* TAP AREA */

    .tap-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 42px 0;
      position: relative;
    }

    .tap-ring {
      width: 225px;
      height: 225px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(55, 95, 170, 0.18) 0%,
          rgba(20, 35, 65, 0.1) 48%,
          transparent 70%
        );

        0 0 0 1px rgba(91, 133, 205, 0.18),

    }

    .tap-btn {
      width: 175px;
      height: 175px;

      border-radius: 50%;
      border: 1px solid rgba(130, 164, 230, 0.35);

      color: white;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;

      cursor: pointer;
      user-select: none;

      background:
        radial-gradient(
          circle at 35% 25%,
          #3e5f9c 0%,
          #1d3158 38%,
          #101a30 75%,
          #0a101d 100%
        );

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(66, 116, 210, 0.22),
        inset 0 2px 8px rgba(255,255,255,0.12),
        inset 0 -8px 15px rgba(0,0,0,0.35);

      transition:
        transform 0.08s ease,
        box-shadow 0.15s ease;
    }

    .tap-btn:active {
      transform: scale(0.93);

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.5),
        0 0 45px rgba(66, 116, 210, 0.35),
        inset 0 4px 12px rgba(0,0,0,0.35);
    }

    .tap-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* STATUS */

    .status {
      width: 100%;
      padding: 18px;

      border-radius: 20px;

      background:
        rgba(13, 19, 32, 0.88);

      border: 1px solid rgba(105, 132, 180, 0.16);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.25);
    }

    .status-row {
      display: flex;
      justify-content: space-between;

    }

    .status-title {
      color: #78869e;

      color: #b7cbef;

    .timer-box {

    }

    .timer {
      color: #8faee5;

    }

    /* ERROR */

    .error-box {
      width: 100%;
      margin-top: 15px;
      padding: 12px;

      border-radius: 14px;

      background: rgba(90, 25, 35, 0.45);
      border: 1px solid rgba(220, 75, 95, 0.25);

      color: #ff9eaa;
      font-size: 12px;
      text-align: center;

      display: none;
      word-break: break-word;
    }

    /* TAP +1 */

    .tap-effect {
      position: fixed;
      pointer-events: none;

      color: #a9c5ff;
      font-size: 25px;
      font-weight: 900;

      text-shadow:
        0 0 12px rgba(100,150,255,0.55);

      animation: floatUp 0.8s ease-out forwards;

      z-index: 9999;
    }

    @keyframes floatUp {

      0% {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-80px)
          scale(1.35);
      }

    }

    /* MOBILE */

    @media (max-width: 360px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tap-ring {
        width: 205px;
        height: 205px;
      }

      .tap-btn {
        width: 160px;
        height: 160px;
      }

      .points {
        font-size: 40px;
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        NEXORA
      </div>

      <div class="subtitle">
        TAP • EARN • BUILD
      </div>

    </div>


    <!-- POINTS -->

    <div class="points-box">

      <div class="points-label">
        موجودی امتیاز
      </div>

      <div
        class="points"
        id="points"
      >
        0
      </div>

      <div class="points-unit">
        NEXORA POINTS
      </div>

    </div>


    <!-- TAP -->

    <div class="tap-area">

      <div class="tap-ring">

        <button
          class="tap-btn"
          id="tapBtn"
        >
          TAP
        </button>

      </div>

    </div>


    <!-- STATUS -->

    <div class="status">

      <div class="status-row">

        <div class="status-title">
          درخواست باقی‌مانده
        </div>

        <div
          class="remaining"
          id="remaining"
        >
          1000
        </div>

      </div>


      <div class="timer-box">

        <div class="timer-label">
          زمان تا ریست
        </div>

        <div
          class="timer"
          id="timer"
        >
          08:00:00
        </div>

      </div>

    </div>


    <!-- ERROR -->

    <div
      class="error-box"
      id="errorBox"
    ></div>

  </div>


  <script>

    // ==============================
    // TELEGRAM
    // ==============================

    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    if (tg) {
      tg.ready();
      tg.expand();
    }


    // ==============================
    // API
    // ==============================

    const API_URL =
      "https://zpejsrxapxozwpeyvfbw.supabase.co/functions/v1/super-action";


    // ==============================
    // SETTINGS
    // ==============================

    const MAX_REQUESTS = 1000;

    const EIGHT_HOURS =
      8 * 60 * 60 * 1000;


    // ==============================
    // ELEMENTS
    // ==============================

    const tapBtn =
      document.getElementById("tapBtn");

    const pointsEl =
      document.getElementById("points");

    const remainingEl =
      document.getElementById("remaining");

    const timerEl =
      document.getElementById("timer");

    const errorBox =
      document.getElementById("errorBox");


    // ==============================
    // LOCAL DATA
    // ==============================

    let points =
      Number(
        localStorage.getItem("nexo_points")
      ) || 0;


    let remaining =
      Number(
        localStorage.getItem("nexo_remaining")
      );


    if (!Number.isFinite(remaining)) {
      remaining = MAX_REQUESTS;
    }


    let resetAt =
      Number(
        localStorage.getItem("nexo_reset_at")
      ) || 0;


    // ==============================
    // TELEGRAM USER
    // ==============================

    let telegramUser = null;


    if (
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
    ) {

      telegramUser =
        tg.initDataUnsafe.user;

    } else {

      telegramUser = {
        id: "test_user"
      };

    }


    // ==============================
    // UPDATE UI
    // ==============================

    function updateUI() {

      pointsEl.textContent =
        points.toLocaleString("en-US");


      remainingEl.textContent =
        Math.max(
          0,
          remaining
        ).toLocaleString("en-US");

    }


    // ==============================
    // TIMER
    // ==============================

    function updateTimer() {

      if (!resetAt) {

        timerEl.textContent =
          "08:00:00";

        return;
      }


      const diff =
        resetAt - Date.now();


      if (diff <= 0) {

        remaining =
          MAX_REQUESTS;


        localStorage.setItem(
          "nexo_remaining",
          String(MAX_REQUESTS)
        );


        localStorage.removeItem(
          "nexo_reset_at"
        );


        resetAt = 0;


        tapBtn.disabled =
          false;


        timerEl.textContent =
          "08:00:00";


        updateUI();

        return;
      }


      const totalSeconds =
        Math.floor(
          diff / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      timerEl.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

    }


    // ==============================
    // ERROR
    // ==============================

    function showError(message) {

      errorBox.style.display =
        "block";

      errorBox.textContent =
        message;

    }


    function clearError() {

      errorBox.style.display =
        "none";

      errorBox.textContent =
        "";

    }


    // ==============================
    // TAP EFFECT
    // ==============================

    function showTapEffect() {

      const effect =
        document.createElement("div");


      effect.className =
        "tap-effect";


      effect.textContent =
        "+1";


      const rect =
        tapBtn.getBoundingClientRect();


      effect.style.left =
        (
          rect.left +
          rect.width / 2
        ) + "px";


      effect.style.top =
        (
          rect.top + 20
        ) + "px";


      document.body.appendChild(
        effect
      );


      setTimeout(() => {

        effect.remove();

      }, 800);

    }


    // ==============================
    // TAP
    // ==============================

    async function tap() {

      if (remaining <= 0) {

        showError(
          "سقف ۱۰۰۰ درخواست شما تمام شده است."
        );

        return;
      }


      clearError();


      tapBtn.disabled =
        true;


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                action: "tap",

                telegram_user:
                  telegramUser

              })

            }
          );


        const rawText =
          await response.text();


        console.log(
          "SERVER STATUS:",
          response.status
        );


        console.log(
          "SERVER RESPONSE:",
          rawText
        );


        let data;


        try {

          data =
            JSON.parse(
              rawText
            );

        } catch {

          throw new Error(
            "پاسخ نامعتبر از سرور (" +
            response.status +
            "): " +
            rawText
          );

        }


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(

            data.error ||

            data.message ||

            (
              "خطای سرور " +
              response.status
            )

          );

        }


        // ==========================
        // SUCCESS
        // ==========================

        if (
          typeof data.points !==
          "undefined"
        ) {

          points =
            Number(
              data.points
            );

        } else {

          points =
            points + 1;

        }


        localStorage.setItem(
          "nexo_points",
          String(points)
        );


        if (
          typeof data.remaining !==
          "undefined"
        ) {

          remaining =
            Number(
              data.remaining
            );

        } else {

          remaining =
            Math.max(
              0,
              remaining - 1
            );

        }


        localStorage.setItem(
          "nexo_remaining",
          String(remaining)
        );


        if (data.resetAt) {

          resetAt =
            new Date(
              data.resetAt
            ).getTime();


          localStorage.setItem(
            "nexo_reset_at",
            String(resetAt)
          );

        }


        updateUI();

        showTapEffect();


        tapBtn.disabled =
          remaining <= 0;

      }


      catch (error) {

        console.error(
          "TAP ERROR:",
          error
        );


        const message =
          error &&
          error.message
            ? error.message
            : String(error);


        showError(
          "خطای واقعی: " +
          message
        );


        alert(
          "خطای واقعی:\n\n" +
          message
        );


        tapBtn.disabled =
          false;

      }

    }


    // ==============================
    // BUTTON
    // ==============================

    tapBtn.addEventListener(
      "click",
      tap
    );


    // ==============================
    // START
    // ==============================

    updateUI();

    updateTimer();


    setInterval(
      updateTimer,
      1000
    );

  </script>

</body>
</html>
